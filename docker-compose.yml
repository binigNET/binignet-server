version: "3.7"

services:
  pvpgn:
    restart: unless-stopped
    container_name: pvpgn_server
    image: ender25/pvpgn-server:bnetd-mysql
    depends_on:
      - pvpgn-db
      - aura
    environment:
      - PUBLIC_IP=${PUBLIC_IP}
    # map aura's docker IP to the public IP so players can join hosted games
    entrypoint: >
      /bin/sh -c "
      echo 'Configuring Address Translation...' &&
      AURA_IP=\$$(getent hosts aura | awk '{ print \$$1 }') &&
      echo \"\$$AURA_IP:6320 \$$PUBLIC_IP:6320 NONE ANY\" > /usr/local/etc/pvpgn/address_translation.conf &&
      echo 'Starting PvPGN...' &&
      /usr/local/sbin/bnetd -f
      "
    user: root
    ports:
      - 6112:6112
      - 6112:6112/udp
      - 6200:6200
      - 6200:6200/udp
      - 4000:4000
      - 4000:4000/udp
    volumes:
      - ./pvpgn/etc/pvpgn:/usr/local/etc/pvpgn
      - ./pvpgn/var/pvpgn:/usr/local/var/pvpgn
    networks:
      - internal

  pvpgn-db:
    restart: unless-stopped
    container_name: pvpgn_databse
    image: ender25/pvpgn-server:mysql-db
    ports:
      - 127.0.0.1:3306:3306
    volumes:
      - ./pvpgn/database:/var/lib/mysql
    environment:
      MYSQL_DATABASE: "bnetd"
      MYSQL_USER: "bnetd"
      MYSQL_PASSWORD: "secret" # this is not a risk
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    networks:
      - internal

  pvpgn-stats:
    restart: unless-stopped
    container_name: pvppg_stats_server
    depends_on:
      - pvpgn-db
    image: ender25/pvpgn-server:web-server
    volumes:
      - ./pvpgn-stats:/var/www/html
      - ./pvpgn/var/pvpgn/ladders:/ladders
    ports:
      - 9082:80
    env_file:
      - pvpgn/.env
    networks:
      - internal
      - proxy

  aura:
    restart: unless-stopped
    container_name: aura_server
    image: jasjamjos/aura-bot:13.6.4-bn.1
    environment:
      - AURA_REALM1_USERNAME=${AURA_REALM1_USERNAME}
      - AURA_REALM1_PASSWORD=${AURA_REALM1_PASSWORD}
      - AURA_REALM1_SUDO_USERS=${AURA_REALM1_SUDO_USERS:-yes}
    stop_grace_period: 30s
    ports:
      - 6320:6320
    volumes:
      - ./aura/data:/data
      - ./aura/config.ini:/data/config.ini:ro
    command: ["--no-lan"]
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  phpmyadmin:
    restart: unless-stopped
    container_name: pvpgn_database_admin
    depends_on:
      - pvpgn-db
    image: phpmyadmin/phpmyadmin
    ports:
      - 127.0.0.1:8085:80
    environment:
      PMA_HOSTS: "pvpgn-db"
    networks:
      - internal

networks:
  internal:
  proxy:
    external: true

