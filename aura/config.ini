#######################################################################
# Aura config (based on aura-bot docker/config.ini.example)
#
# Values written as env:NAME are read from the container environment
# (root .env via docker-compose). env:NAME=fallback uses the fallback.
# See ../aura-bot CONFIG.md for all keys.
#######################################################################

### WC3 1.26a only
hosting.game_versions.main = 1.26
hosting.game_versions.supported = 1.26

### paths inside the /data volume
bot.maps_path = maps
bot.map_configs_path = mapcfgs
bot.map_cache_path = mapcache
bot.jass_path = jass
bot.save_path = saves
bot.log_path = aura.log

### must match the port published in docker-compose.yml and
###  pvpgn address_translation.conf
net.host_port.only = 6320

### container sits behind Docker NAT: no UPnP, no LAN broadcast
net.port_forwarding.upnp.enabled = no
net.game_discovery.udp.broadcast.enabled = no
net.udp_ipv6.enabled = no

##########
# REALM  #
##########

realm_1.enabled = yes
realm_1.host_name = pvpgn
realm_1.server_port = 6112
realm_1.unique_name = PVPGN
realm_1.type = pvpgn
realm_1.login.hash_type = pvpgn
realm_1.exe_auth.version = 1.26
realm_1.locale_short = enUS
realm_1.country_short = PHL
realm_1.country = Philippines

realm_1.username = env:AURA_REALM1_USERNAME
realm_1.password = env:AURA_REALM1_PASSWORD
realm_1.auto_register = yes
### root admins, comma-separated; manage bot via whisper commands
realm_1.sudo_users = env:AURA_REALM1_SUDO_USERS=yes
### admins act as owner of every game (dashboard needs this to unhost others' lobbies)
realm_1.admins = env:AURA_REALM1_ADMINS=binignet_admin
realm_1.first_channel = Warcraft 3 Frozen Throne

##########
# IRC    #
##########

irc.enabled = no

##########
# DISCORD: not built into this image
##########

discord.enabled = no
