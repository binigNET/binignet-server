services:
  pvpgn:
    restart: unless-stopped
    container_name: pvpgn_server
    build: ./src/pvpgn
    image: binignet/pvpgn:local
    platform: linux/amd64
    depends_on:
      pvpgn-db:
        condition: service_healthy
      aura:
        condition: service_started
    environment:
      - PUBLIC_IP=${PUBLIC_IP}
      - DB_NAME=${DB_NAME:-bnetd}
      - DB_USER=${DB_USER:-bnetd}
      - DB_PASS=${DB_PASS:-secret}
    ports:
      - 6112:6112
      - 6112:6112/udp
      - 6200:6200
      - 6200:6200/udp
    volumes:
      - pvpgn-ladders:/usr/local/var/pvpgn/ladders
      - pvpgn-mail:/usr/local/var/pvpgn/bnmail
      - pvpgn-reports:/usr/local/var/pvpgn/reports
      - pvpgn-status:/usr/local/var/pvpgn/status
      # admin-editable files (bans, motd/news, banners, channels, icons), shared w/ admin
      - ./pvpgn/admin:/usr/local/var/pvpgn/admin
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6112'"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

  pvpgn-db:
    restart: unless-stopped
    container_name: pvpgn-db
    image: ender25/pvpgn-server:mysql-db@sha256:60057a7a630f7f8b60c03982910b9fd484779f11d909bc15539b29f78a2d05e7
    ports:
      - 127.0.0.1:3306:3306
    volumes:
      - ./pvpgn/database:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-bnetd}
      MYSQL_USER: ${DB_USER:-bnetd}
      MYSQL_PASSWORD: ${DB_PASS:-secret}
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

  # pvpgn-stats:
  #   restart: unless-stopped
  #   container_name: pvppg_stats_server
  #   depends_on:
  #     - pvpgn-db
  #   image: ender25/pvpgn-server:web-server
  #   volumes:
  #     - ./pvpgn-stats:/var/www/html
  #     - pvpgn-ladders:/ladders
  #   ports:
  #     - 9082:80
  #   env_file:
  #     - pvpgn/.env
  #   networks:
  #     - internal
  aura-init:
    image: jasjamjos/aura-bot:13.6.4-bn.1
    user: "0:0"
    entrypoint: ["chown", "-R", "1000:1000", "/data"]
    volumes:
      - ./aura/data:/data
    restart: "no"

  aura:
    restart: unless-stopped
    container_name: aura
    depends_on:
      aura-init:
        condition: service_completed_successfully
    image: jasjamjos/aura-bot:13.6.4-bn.1
    environment:
      - AURA_REALM1_USERNAME=${AURA_REALM1_USERNAME}
      - AURA_REALM1_PASSWORD=${AURA_REALM1_PASSWORD}
      - AURA_REALM1_SUDO_USERS=${AURA_REALM1_SUDO_USERS:-yes}
    stop_grace_period: 30s
    ports:
      - 6320:6320
    volumes:
      - ./aura/data:/data
      - ./aura/config.ini:/data/config.ini:ro
    command: ["--no-lan"]
    networks:
      internal:
        # fixed so pvpgn address translation survives aura recreate
        ipv4_address: 172.28.0.10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  admin:
    restart: unless-stopped
    container_name: binignet_admin
    build: ./src/admin
    image: binignet/admin:local
    depends_on:
      - pvpgn
      - docker-proxy
    environment:
      - ORIGIN=https://${ADMIN_DOMAIN:-bnetadmin.bubuyogg.com}
      - ADDRESS_HEADER=X-Forwarded-For
      - XFF_DEPTH=1
      # map uploads (8 MB) + multipart overhead
      - BODY_SIZE_LIMIT=10M
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD not set}
      - DB_NAME=${DB_NAME:-bnetd}
      - DB_USER=${DB_USER:-bnetd}
      - DB_PASS=${DB_PASS:-secret}
      - PVPGN_ADMIN_USER=${PVPGN_ADMIN_USER:-binignet_admin}
      - PVPGN_ADMIN_PASS=${PVPGN_ADMIN_PASS:?PVPGN_ADMIN_PASS not set}
      - AURA_BOT=${AURA_REALM1_USERNAME}
      - DOCKER_API=http://docker-proxy:2375
    volumes:
      - ./pvpgn/admin:/data/pvpgn-admin
      - pvpgn-status:/data/pvpgn-status:ro
      - ./aura/data:/data/aura
    networks:
      - internal
      - dockerapi

  # read-only docker API (GET /containers only) so admin can show aura's logs
  docker-proxy:
    restart: unless-stopped
    container_name: docker-proxy
    image: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    environment:
      - CONTAINERS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - dockerapi

  caddy:
    restart: unless-stopped
    container_name: caddy
    image: caddy:2@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    depends_on:
      - admin
    environment:
      - ADMIN_DOMAIN=${ADMIN_DOMAIN:-bnetadmin.bubuyogg.com}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./src/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal

  phpmyadmin:
    restart: unless-stopped
    container_name: pvpgn_database_admin
    depends_on:
      - pvpgn-db
    image: phpmyadmin/phpmyadmin:latest@sha256:42a200db07b4e70fbf32c594ad4521cf16399b8e54bbb5adceae98e7566dfbeb
    ports:
      - 127.0.0.1:8085:80
    environment:
      PMA_HOSTS: "pvpgn-db"
    networks:
      - internal

volumes:
  pvpgn-ladders:
  pvpgn-mail:
  pvpgn-reports:
  pvpgn-status:
  caddy-data:
  caddy-config:

networks:
  # admin <-> docker-proxy only, no outside access
  dockerapi:
    internal: true
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
