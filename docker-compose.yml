version: "3.7"

services:
  pvpgn:
    restart: unless-stopped
    container_name: pvpgn_server
    build: ./src/pvpgn
    image: binignet/pvpgn:local
    platform: linux/amd64
    depends_on:
      pvpgn-db:
        condition: service_healthy
      aura:
        condition: service_started
    environment:
      - PUBLIC_IP=${PUBLIC_IP}
      - DB_NAME=${DB_NAME:-bnetd}
      - DB_USER=${DB_USER:-bnetd}
      - DB_PASS=${DB_PASS:-secret}
    ports:
      - 6112:6112
      - 6112:6112/udp
      - 6200:6200
      - 6200:6200/udp
      - 4000:4000
      - 4000:4000/udp
    volumes:
      - pvpgn-var:/usr/local/var/pvpgn
    networks:
      - internal

  pvpgn-db:
    restart: unless-stopped
    container_name: pvpgn-db
    image: ender25/pvpgn-server:mysql-db
    ports:
      - 127.0.0.1:3306:3306
    volumes:
      - ./pvpgn/database:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-bnetd}
      MYSQL_USER: ${DB_USER:-bnetd}
      MYSQL_PASSWORD: ${DB_PASS:-secret}
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

  # pvpgn-stats:
  #   restart: unless-stopped
  #   container_name: pvppg_stats_server
  #   depends_on:
  #     - pvpgn-db
  #   image: ender25/pvpgn-server:web-server
  #   volumes:
  #     - ./pvpgn-stats:/var/www/html
  #     - ./pvpgn/var/pvpgn/ladders:/ladders
  #   ports:
  #     - 9082:80
  #   env_file:
  #     - pvpgn/.env
  #   networks:
  #     - internal
  #     - proxy
  aura-init:
    image: jasjamjos/aura-bot:13.6.4-bn.1
    user: "0:0"
    entrypoint: ["chown", "-R", "1000:1000", "/data"]
    volumes:
      - ./aura/data:/data
    restart: "no"

  aura:
    restart: unless-stopped
    container_name: aura
    depends_on:
      aura-init:
        condition: service_completed_successfully
    image: jasjamjos/aura-bot:13.6.4-bn.1
    environment:
      - AURA_REALM1_USERNAME=${AURA_REALM1_USERNAME}
      - AURA_REALM1_PASSWORD=${AURA_REALM1_PASSWORD}
      - AURA_REALM1_SUDO_USERS=${AURA_REALM1_SUDO_USERS:-yes}
    stop_grace_period: 30s
    ports:
      - 6320:6320
    volumes:
      - ./aura/data:/data
      - ./aura/config.ini:/data/config.ini:ro
    command: ["--no-lan"]
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  phpmyadmin:
    restart: unless-stopped
    container_name: pvpgn_database_admin
    depends_on:
      - pvpgn-db
    image: phpmyadmin/phpmyadmin
    ports:
      - 127.0.0.1:8085:80
    environment:
      PMA_HOSTS: "pvpgn-db"
    networks:
      - internal

volumes:
  pvpgn-var:

networks:
  internal:
    driver: bridge
  proxy:
    name: proxy
    driver: bridge